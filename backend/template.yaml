AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: dotnet10
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        # Only the parameter NAME is passed — never the secret itself. The
        # connection string is fetched & decrypted from SSM SecureString at
        # startup, so no plaintext lives in git, this template, or the Lambda env.
        DB_URL_SSM_PARAM: /suburblens/supabase-db-url
        REDIS_SSM_PARAM: /suburblens/redis-connection
        HEATMAP_CACHE_TTL_SECONDS: '86400'

Resources:
  SuburbLensApi:
    Type: AWS::Serverless::Function
    Properties:
      Handler: SuburbLens.Api
      CodeUri: SuburbLens.Api/
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        # Read the SecureString DB connection string parameter…
        - SSMParameterReadPolicy:
            ParameterName: suburblens/supabase-db-url
        # …and the Redis (Upstash) connection string parameter…
        - SSMParameterReadPolicy:
            ParameterName: suburblens/redis-connection
        # …and decrypt them, but only via the SSM service (defence in depth).
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
      Events:
        ProxyEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        HealthEvent:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
