name: agent

on:
    push:
        branches: [dev, main]
        paths:
            - "agent/**"
            - ".github/workflows/agent.yml"
    pull_request:
        paths:
            - "agent/**"
            - ".github/workflows/agent.yml"

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: agent
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: agent/requirements.txt
            - run: pip install -r requirements.txt
            - run: pip install -r requirements-dev.txt
            - run: python -m compileall .
            - name: Unit tests (offline)
              run: pytest
            - name: Guard suite (deterministic, offline)
              run: python test_guard.py
              env:
                  # A non-empty placeholder so guard.py's import-time ChatOpenAI()
                  # constructs. The deterministic layers use a fake classifier and
                  # never call the API; the live L2 test stays opt-in (unset flag).
                  OPENROUTER_API_KEY: dummy-key-for-ci
