[pytest]
# Run from the agent/ directory. Put agent/ on sys.path so the flat modules
# (normalize, guard, ...) import as top-level names, matching how the app runs.
pythonpath = .
addopts = -q --import-mode=importlib

# The other test_*.py files here are NOT pytest suites and must not be collected:
#   test_graph.py  / test_server.py  — manual scripts that hit the network or a
#                                      running server at import time
#   test_guard.py                    — a self-contained offline runner invoked as
#                                      `python test_guard.py` (run separately in CI)
python_files = test_normalize.py
