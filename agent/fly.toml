# fly.toml app configuration file generated for suburblens-agent on 2026-06-23T11:20:22+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'suburblens-agent'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Health check — give cold starts time to build the Supabase pool + checkpointer.setup()
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
